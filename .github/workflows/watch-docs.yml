name: Watch OpenAI plugin docs

# Fetches ONLY the two public OpenAI developer docs pages (one request each per run)
# and commits data/rules-history.json when their text changes.
#
# Keepalive: GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. A docs change produces a commit; in addition, on the 1st of each
# month this workflow makes an empty "keepalive" commit so the schedule never lapses.

on:
  schedule:
    - cron: '17 3 * * *' # daily 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-docs
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run docs watcher
        run: node scripts/watch-docs.mjs
      - name: Commit history if changed
        run: |
          git config user.name "pluginlint-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "data: OpenAI plugin docs changed ($(date -u +%F))"
            git push
          else
            echo "No docs changes."
          fi
      - name: Monthly keepalive commit
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git pull --ff-only
            git commit --allow-empty -m "chore: monthly keepalive ($(date -u +%F))"
            git push
          fi
